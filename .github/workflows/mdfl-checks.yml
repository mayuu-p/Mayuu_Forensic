name: MDFL checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web dependencies
        run: npm install
        working-directory: web
      - name: Build web dashboard
        run: npm run build
        working-directory: web
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile API source
        run: python -m compileall -q forensic-engine/app
